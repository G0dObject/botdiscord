<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guildforge Arcade</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap');
    :root{--bg:#070a12;--panel:#10182a;--panel-hi:#18233c;--line:#2a3959;--text:#f5f7ff;--muted:#8d9ab8;--gold:#ffce68;--aqua:#60efd1;--pink:#ff719a;--violet:#9282ff;--red:#b94361;--black:#222937;--green:#278f76}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% -10%,#264a80 0,transparent 40%),radial-gradient(ellipse at 100% 100%,#46204d 0,transparent 40%),var(--bg);color:var(--text);font-family:Manrope,sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}.loading{display:grid;min-height:100vh;place-items:center;color:var(--muted)}.shell{max-width:1240px;margin:auto;padding:22px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:19px}.brand{font-size:15px;font-weight:800;letter-spacing:1.7px}.brand b{color:var(--gold)}.balance{font:500 13px 'DM Mono';color:var(--gold);padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:#0d1423}.layout{display:grid;grid-template-columns:226px 1fr;gap:16px}.sidebar,.board{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#151e32e8,#0d1221e8)}.sidebar{padding:13px}.side-title{padding:10px 11px;color:var(--muted);font:500 10px 'DM Mono';letter-spacing:1.4px;text-transform:uppercase}.games{display:grid;gap:6px}.games button{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:13px;background:transparent;color:var(--muted);text-align:left;font-size:13px;font-weight:800;transition:.2s}.games button:hover,.games button.active{color:var(--text);background:#263555}.games button.active{box-shadow:inset 3px 0 var(--aqua)}.game-icon{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#0a1020;color:var(--aqua);font-family:'DM Mono'}.board{position:relative;min-height:590px;padding:31px;overflow:hidden}.board:before{content:'';position:absolute;width:440px;height:440px;right:-230px;top:-250px;border:1px solid #80f2d21e;border-radius:50%;pointer-events:none}.eyebrow{color:var(--aqua);font:500 10px 'DM Mono';letter-spacing:1.7px}.title{font-size:clamp(30px,4vw,45px);letter-spacing:-2px;line-height:1.05;margin:10px 0}.hint{max-width:570px;margin:0 0 24px;color:var(--muted);font-size:14px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.field{height:44px;min-width:126px;padding:0 38px 0 13px;border:1px solid var(--line);border-radius:11px;outline:none;background:#0a1020;color:var(--text);font-weight:700;appearance:none;-webkit-appearance:none}.field:focus{border-color:var(--aqua);box-shadow:0 0 0 3px #60efd121}.number{padding-right:13px}.primary,.choice{min-height:44px;padding:0 15px;border-radius:11px;font-weight:800;transition:transform .15s,filter .15s}.primary{background:linear-gradient(135deg,var(--aqua),#70cfff);color:#07111d}.primary:hover,.choice:hover{filter:brightness(1.13);transform:translateY(-1px)}.primary:disabled{opacity:.55;cursor:wait;transform:none}.choice{background:#263453;color:var(--text)}.choice.red{background:var(--red)}.choice.black{background:var(--black)}.choice.green{background:var(--green)}.result{position:relative;z-index:1;min-height:82px;margin-top:22px;padding:15px 17px;border:1px solid var(--line);border-radius:15px;background:#0a1020;color:#d8e0f3;white-space:pre-line;line-height:1.65;font-size:14px}.result.good{border-color:#60efd166;color:var(--aqua)}.result.bad{border-color:#ff719a66;color:#ffb0c4}.coin-stage,.dice-stage{display:grid;place-items:center;height:250px}.coin{display:grid;place-items:center;width:145px;height:145px;border:9px solid #ffe5a5;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc95b,#a9571d 63%,#653014);box-shadow:0 0 0 8px #7e3d18,0 26px 45px #0008;color:#fff9db;font:800 51px 'DM Mono'}.coin.flip{animation:coin-flip .9s cubic-bezier(.2,.7,.3,1)}@keyframes coin-flip{25%{transform:translateY(-48px) rotateY(540deg)}60%{transform:translateY(-58px) rotateY(1080deg)}100%{transform:translateY(0) rotateY(1440deg)}}.dice{display:grid;place-items:center;width:122px;height:122px;border-radius:26px;background:linear-gradient(145deg,#ff7b9e,#9246d4);box-shadow:inset -12px -12px #682ca566,0 24px 45px #0007;font-size:54px}.dice.rolling{animation:dice-roll .7s cubic-bezier(.25,.8,.25,1)}@keyframes dice-roll{25%{transform:translate(-38px,-35px) rotate(180deg)}65%{transform:translate(32px,-52px) rotate(490deg)}100%{transform:rotate(720deg)}}.slot-machine{max-width:540px;margin:36px auto 0;padding:20px;border:1px solid #516188;border-radius:22px;background:linear-gradient(150deg,#27365c,#11182c);box-shadow:0 22px 60px #0008}.slot-head{display:flex;justify-content:space-between;margin-bottom:12px;color:var(--gold);font:500 10px 'DM Mono';letter-spacing:1.5px}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.reel{display:grid;place-items:center;height:93px;border:1px solid #3c4d75;border-radius:12px;background:#080d19;font:800 18px 'DM Mono'}.slot-machine.spinning .reel{animation:reel .16s linear infinite}.slot-machine.spinning .reel:nth-child(2){animation-delay:.05s}.slot-machine.spinning .reel:nth-child(3){animation-delay:.1s}@keyframes reel{50%{transform:translateY(-8px);color:var(--gold);filter:brightness(1.6)}}.cards{margin-top:35px;display:grid;gap:12px}.hand{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#0b1120}.hand-label{width:66px;color:var(--muted);font:500 11px 'DM Mono';text-transform:uppercase}.playing-card{display:grid;place-items:center;width:46px;height:63px;border-radius:7px;background:#eef2ff;color:#17213d;font:800 17px 'DM Mono';box-shadow:0 5px 13px #0005}.playing-card.dealer{background:#263351;color:#9eacce}.roulette-layout{display:grid;grid-template-columns:minmax(0,1fr) 225px;gap:18px}.roulette-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}.roulette-grid button{height:34px;border:1px solid #ffffff16;border-radius:7px;color:#fff;font:500 11px 'DM Mono';transition:.15s}.roulette-grid button:hover{filter:brightness(1.23)}.roulette-grid .red{background:var(--red)}.roulette-grid .black{background:var(--black)}.roulette-grid .green{background:var(--green)}.roulette-grid .selected{outline:3px solid var(--gold);outline-offset:1px;z-index:1}.roulette-side{padding:14px;border:1px solid var(--line);border-radius:14px;background:#0a1020}.roulette-meta{display:grid;gap:8px;color:var(--muted);font:500 11px 'DM Mono'}.roulette-meta b{color:var(--gold)}.players{display:grid;gap:7px;margin-top:14px}.player{display:flex;justify-content:space-between;gap:8px;padding:9px;border-radius:9px;background:#151f34;color:#c9d3eb;font-size:11px}.crash-stage{position:relative;height:260px;margin-top:30px;border:1px solid var(--line);border-radius:19px;overflow:hidden;background:linear-gradient(180deg,#16264c,#080d18)}.crash-stage:before{content:'';position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:34px 34px}.crash-stage:after{content:'';position:absolute;left:0;right:0;bottom:42px;border-top:1px dashed #80a1ce6b}.multiplier{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font:800 clamp(42px,8vw,78px) 'DM Mono';text-shadow:0 0 30px #60efd199}.rocket{position:absolute;z-index:2;left:11%;bottom:19%;font-size:48px;filter:drop-shadow(0 0 14px #ff719a);transform:rotate(42deg);transition:transform .1s linear}.crash-stage.busted{background:radial-gradient(circle,#8e304d,#210d1b 58%)}.crash-stage.busted .rocket{opacity:0}.crash-stage.busted .multiplier{color:#ffb1c5;text-shadow:0 0 30px #ff719a99}.cash{background:linear-gradient(135deg,var(--gold),#ff9d5a)}@media(max-width:760px){.shell{padding:12px}.layout{grid-template-columns:1fr}.sidebar{overflow:auto}.games{display:flex;width:max-content}.games button{white-space:nowrap}.board{min-height:620px;padding:22px}.roulette-layout{grid-template-columns:1fr}.roulette-side{order:-1}.roulette-grid{grid-template-columns:repeat(8,1fr)}.choice{padding:0 10px;font-size:12px}}
    /* Animated mechanical reels and the roulette ball override the base table styling. */
    .reel{position:relative;display:block;overflow:hidden;height:93px}.slot-machine.spinning .reel{animation:none}.reel:before,.reel:after{content:'';position:absolute;z-index:1;left:0;right:0;height:22px;pointer-events:none}.reel:before{top:0;background:linear-gradient(#080d19,transparent)}.reel:after{bottom:0;background:linear-gradient(transparent,#080d19)}.reel-strip{display:grid;grid-auto-rows:72px;place-items:center;transform:translateY(-288px);transition:transform .55s cubic-bezier(.1,.65,.2,1);will-change:transform}.reel-strip span{display:grid;place-items:center;width:100%;font-size:35px}.slot-machine.spinning .reel-strip{animation:reel-drop .28s linear infinite}@keyframes reel-drop{to{transform:translateY(-504px)}}.roulette-wheel{position:relative;width:190px;height:190px;margin:0 auto 19px;border:12px solid #d7b45c;border-radius:50%;background:repeating-conic-gradient(#b83f59 0 9.7deg,#242a3a 9.7deg 19.4deg);box-shadow:inset 0 0 0 8px #161c2c,0 14px 34px #0008}.wheel-numbers{position:absolute;inset:11px;border-radius:50%;animation:wheel-idle 7s linear infinite}.wheel-numbers i{position:absolute;left:calc(50% - 8px);top:0;height:84px;transform-origin:8px 84px;color:#f7e7b0;font:500 8px 'DM Mono';font-style:normal}.wheel-core{position:absolute;inset:45px;display:grid;place-items:center;border:6px solid #d7b45c;border-radius:50%;background:#111828;color:var(--gold);font-size:26px}.ball{position:absolute;z-index:3;left:calc(50% - 7px);top:13px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 2px 5px #000}.roulette-wheel.spun .wheel-numbers{animation:wheel-stop 3s cubic-bezier(.13,.7,.08,1) forwards}.roulette-wheel.spun .ball{animation:ball-stop 3s cubic-bezier(.18,.7,.1,1) forwards}@keyframes wheel-idle{to{transform:rotate(360deg)}}@keyframes wheel-stop{to{transform:rotate(calc(1440deg + var(--stop)))}}@keyframes ball-stop{to{transform:rotate(calc(-1080deg - var(--stop))) translateY(23px)}}
  </style>
</head>
<body>
  <main id="app" class="loading">Подключение к Discord...</main>
  <script type="module">
    import { DiscordSDK } from '/activity/sdk/index.mjs';

    const app = document.getElementById('app');
    const games = {
      coin: ['Монетка', 'Выбери сторону. Верная ставка выплачивается 2x.', '◉'],
      dice: ['Кости', '4, 5 или 6 приносят 2x ставку.', '◆'],
      slots: ['Слоты', 'Пара 2x, тройка 4x, три семёрки 10x.', '▥'],
      roulette: ['Общая рулетка', 'Все игроки ставят в единый 12-секундный раунд.', '◎'],
      twentyOne: ['21', 'Карточный стол против дилера.', '♠'],
      crash: ['Crush', 'Забери выигрыш до того, как ракета сгорит.', '↗']
    };
    const redNumbers = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
    let token = '', current = 'coin', scene = 0, rouletteChoice = 'red', twentyOneId = '', crashId = '', crashTimer = null;
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    const esc = value => String(value).replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const api = async (url, body) => { const response = await fetch(url, { method: body ? 'POST' : 'GET', headers: { Authorization: `Bearer ${token}`, 'Content-Type':'application/json' }, body: body ? JSON.stringify(body) : undefined }); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Ошибка запроса'); return data; };
    const balance = async () => { const me = await api('/api/activity/me'); const field = document.getElementById('balance'); if (field) field.textContent = `${Number(me.balance).toLocaleString('ru-RU')} ✦`; return me; };
    const setResult = (root, text, type = '') => { const result = root.querySelector('.result'); if (result) { result.textContent = text; result.className = `result ${type}`; } };
    const betValue = root => Number(root.querySelector('[name="bet"]')?.value);
    const table = (title, hint, content, result = 'Выбери ставку и начни игру.') => `<div class="eyebrow">GUILDFORGE / LIVE TABLES</div><h1 class="title">${title}</h1><p class="hint">${hint}</p><div class="play">${content}</div><div class="result">${result}</div>`;
    const controls = (extras = '', action = 'Играть') => `<div class="controls"><input class="field number" name="bet" type="number" min="1" value="100" inputmode="numeric">${extras}<button class="primary" data-action="play">${action}</button></div>`;
    const card = (value, dealer = false) => `<span class="playing-card ${dealer ? 'dealer' : ''}">${value}</span>`;

    function render() {
      scene += 1;
      clearInterval(crashTimer);
      const version = scene, root = document.getElementById('board');
      const [name, hint] = games[current];
      if (current === 'coin') renderCoin(root, version, name, hint);
      else if (current === 'dice') renderDice(root, version, name, hint);
      else if (current === 'slots') renderSlots(root, version, name, hint);
      else if (current === 'roulette') renderRoulette(root, version, name, hint);
      else if (current === 'twentyOne') renderTwentyOne(root, version, name, hint);
      else renderCrash(root, version, name, hint);
    }

    function renderCoin(root, version, name, hint) {
      root.innerHTML = table(name, hint, `${controls('<select class="field" name="choice"><option value="heads">Орёл</option><option value="tails">Решка</option></select>', 'Подбросить')}<div class="coin-stage"><div class="coin">✦</div></div>`);
      root.querySelector('[data-action="play"]').onclick = async () => { const visual = root.querySelector('.coin'), button = root.querySelector('[data-action="play"]'); try { button.disabled = true; visual.classList.add('flip'); await sleep(850); const data = await api('/api/activity/play', { game:'coin', bet:betValue(root), choice:root.querySelector('[name="choice"]').value }); if (version !== scene) return; visual.textContent = data.text.includes('орёл') ? '◉' : '◌'; setResult(root, `${data.text}\nБаланс: ${data.balance.toLocaleString('ru-RU')} ✦`, data.text.includes('Выпало') ? 'good' : ''); await balance(); } catch (error) { setResult(root, error.message, 'bad'); } finally { if (version === scene) button.disabled = false; } };
    }

    function renderDice(root, version, name, hint) {
      root.innerHTML = table(name, hint, `${controls('', 'Бросить')}<div class="dice-stage"><div class="dice">◆</div></div>`);
      root.querySelector('[data-action="play"]').onclick = async () => { const visual = root.querySelector('.dice'), button = root.querySelector('[data-action="play"]'); try { button.disabled = true; visual.classList.add('rolling'); await sleep(700); const data = await api('/api/activity/play', { game:'dice', bet:betValue(root) }); if (version !== scene) return; visual.textContent = data.text.match(/\d/)?.[0] || '◆'; setResult(root, `${data.text}\nБаланс: ${data.balance.toLocaleString('ru-RU')} ✦`, data.text.includes('4') || data.text.includes('5') || data.text.includes('6') ? 'good' : 'bad'); await balance(); } catch (error) { setResult(root, error.message, 'bad'); } finally { if (version === scene) button.disabled = false; } };
    }

    function renderSlots(root, version, name, hint) {
      const icons = ['🍒', '🍋', '💎', '7️⃣']; const strip = () => `<div class="reel"><div class="reel-strip">${[...icons, ...icons, ...icons].map(icon => `<span>${icon}</span>`).join('')}</div></div>`;
      root.innerHTML = table(name, hint, `${controls('', 'Крутить')}<div class="slot-machine"><div class="slot-head"><span>GUILDFORGE SLOTS</span><span>MAX 10x</span></div><div class="reels">${strip()}${strip()}${strip()}</div></div>`);
      root.querySelector('[data-action="play"]').onclick = async () => { const machine = root.querySelector('.slot-machine'), button = root.querySelector('[data-action="play"]'); try { button.disabled = true; machine.classList.add('spinning'); const request = api('/api/activity/play', { game:'slots', bet:betValue(root) }); await sleep(1150); const data = await request; if (version !== scene) return; const result = data.text.split(' / '), map = { CHERRY:'🍒', LEMON:'🍋', GEM:'💎', '7':'7️⃣' }; root.querySelectorAll('.reel-strip').forEach((reel, index) => { const icon = map[result[index]] || '💎', slot = icons.indexOf(icon); reel.style.transform = `translateY(-${(4 + slot) * 72}px)`; }); machine.classList.remove('spinning'); setResult(root, `${result.map(symbol => map[symbol] || symbol).join('  ')}\nБаланс: ${data.balance.toLocaleString('ru-RU')} ✦`, 'good'); await balance(); } catch (error) { setResult(root, error.message, 'bad'); } finally { if (version === scene) { machine.classList.remove('spinning'); button.disabled = false; } } };
    }

    function renderTwentyOne(root, version, name, hint) {
      root.innerHTML = table(name, hint, controls('', 'Раздать карты'));
      root.querySelector('[data-action="play"]').onclick = async () => { try { const game = await api('/api/activity/twenty-one/start', { bet:betValue(root) }); if (version === scene) showTwentyOne(root, version, game); } catch (error) { setResult(root, error.message, 'bad'); } };
    }
    function showTwentyOne(root, version, game) {
      const draw = active => { root.querySelector('.play').innerHTML = active ? '<div class="controls"><button class="primary" data-move="hit">Взять карту</button><button class="choice" data-move="stand">Хватит</button></div>' : '<button class="primary" data-again>Новая раздача</button>'; root.querySelectorAll('[data-move]').forEach(button => button.onclick = () => move(button.dataset.move)); const again = root.querySelector('[data-again]'); if (again) again.onclick = render; };
      const show = (round, active = true) => { root.querySelector('.result').innerHTML = `<div class="cards"><div class="hand"><span class="hand-label">Ты ${round.score}</span>${round.player.map(value => card(value)).join('')}</div><div class="hand"><span class="hand-label">Дилер ${active ? '?' : round.botScore}</span>${round.bot.map(value => card(value, active)).join('')}</div></div><p>Ставка: ${round.bet.toLocaleString('ru-RU')} ✦${round.text ? `<br>${esc(round.text)}` : ''}</p>`; };
      const move = async action => { try { const round = await api(`/api/activity/twenty-one/${twentyOneId}`, { action }); if (version !== scene) return; show(round, round.active); if (!round.active) { draw(false); await balance(); } } catch (error) { setResult(root, error.message, 'bad'); } };
      twentyOneId = game.id; draw(true); show(game);
    }

    function renderRoulette(root, version, name, hint) {
      const numbers = Array.from({ length:37 }, (_, number) => `<button class="${number === 0 ? 'green' : redNumbers.has(number) ? 'red' : 'black'} ${rouletteChoice === String(number) ? 'selected' : ''}" data-choice="${number}">${number}</button>`).join('');
      root.innerHTML = table(name, hint, `${controls('<button class="choice red" data-choice="red">Красное 2x</button><button class="choice black" data-choice="black">Чёрное 2x</button><button class="choice green" data-choice="green">Зеро 14x</button>', 'Поставить')}<div class="roulette-layout"><div><div class="roulette-wheel"><div class="wheel-numbers">${Array.from({ length:18 }, (_, index) => `<i style="transform:rotate(${index * 20}deg)">${index * 2}</i>`).join('')}</div><div class="ball"></div><div class="wheel-core">✦</div></div><div class="roulette-grid">${numbers}</div></div><aside class="roulette-side"><div class="roulette-meta"><span>Выбор: <b data-picked>${rouletteChoice}</b></span><span data-countdown>Ожидание игроков</span></div><div class="players" data-players></div></aside></div>`, 'Выбери поле. Ставка списывается сразу и участвует в общем раунде.');
      root.querySelectorAll('[data-choice]').forEach(button => button.onclick = () => { rouletteChoice = button.dataset.choice; root.querySelector('[data-picked]').textContent = rouletteChoice; root.querySelectorAll('[data-choice]').forEach(item => item.classList.toggle('selected', item.dataset.choice === rouletteChoice)); });
      root.querySelector('[data-action="play"]').onclick = async event => { try { event.currentTarget.disabled = true; const data = await api('/api/activity/roulette/bet', { bet:betValue(root), choice:rouletteChoice }); if (version !== scene) return; setResult(root, 'Ставка принята. Ждём окончания общего раунда.', 'good'); paintRoulette(root, version, data); await balance(); } catch (error) { if (version === scene) { event.currentTarget.disabled = false; setResult(root, error.message, 'bad'); } } };
      watchRoulette(root, version);
    }
    async function watchRoulette(root, version) { try { const data = await api('/api/activity/roulette'); if (version !== scene || !root.isConnected) return; paintRoulette(root, version, data); if (data.status === 'betting') setTimeout(() => watchRoulette(root, version), 750); } catch {} }
    function paintRoulette(root, version, data) { if (version !== scene || !root.isConnected) return; const players = root.querySelector('[data-players]'), countdown = root.querySelector('[data-countdown]'), wheel = root.querySelector('.roulette-wheel'); if (!players || !countdown) return; players.innerHTML = data.players.length ? data.players.map(player => `<div class="player"><span>${esc(player.username)} · ${player.choice}</span><b>${player.bet.toLocaleString()} ✦${player.won === true ? ' · выиграл' : player.won === false ? ' · мимо' : ''}</b></div>`).join('') : '<div class="player">Пока никто не поставил</div>'; if (data.status === 'betting') countdown.textContent = `До броска: ${Math.max(0, Math.ceil((data.closesAt - Date.now()) / 1000)} сек.`; else if (data.status === 'settled') { if (!wheel.classList.contains('spun')) { wheel.classList.add('spun'); wheel.style.setProperty('--stop', `${data.result * 9.73}deg`); } countdown.textContent = `Выпало: ${data.result}`; setResult(root, `Рулетка остановилась на ${data.result}.`, 'good'); balance(); } }

    function renderCrash(root, version, name, hint) {
      root.innerHTML = table(name, hint, controls('', 'Запустить'), 'Ставка списывается на старте. Забери выигрыш до крушения.'); root.querySelector('.play').insertAdjacentHTML('afterend', '<div class="crash-stage"><div class="multiplier">1.00x</div><div class="rocket">↗</div></div>');
      root.querySelector('[data-action="play"]').onclick = async () => { try { const game = await api('/api/activity/crash/start', { bet:betValue(root) }); if (version !== scene) return; crashId = game.id; const started = Date.now(), stage = root.querySelector('.crash-stage'), multiplier = root.querySelector('.multiplier'); root.querySelector('.play').innerHTML = '<button class="primary cash" data-cash>Забрать выигрыш</button>'; crashTimer = setInterval(() => { if (version !== scene || !stage.isConnected) return clearInterval(crashTimer); const value = Math.exp((Date.now() - started) / 8500); multiplier.textContent = `${value.toFixed(2)}x`; stage.querySelector('.rocket').style.transform = `translate(${Math.min(390, (value - 1) * 180)}px, ${-Math.min(112, (value - 1) * 55)}px) rotate(42deg)`; }, 70); root.querySelector('[data-cash]').onclick = () => cashout(root, version); watchCrash(root, version, game.id); } catch (error) { setResult(root, error.message, 'bad'); } };
    }
    async function watchCrash(root, version, id) { try { const data = await api(`/api/activity/crash/${id}`); if (version !== scene || crashId !== id) return; if (data.active) return setTimeout(() => watchCrash(root, version, id), 450); crashId = ''; clearInterval(crashTimer); root.querySelector('.crash-stage')?.classList.add('busted'); root.querySelector('.play').innerHTML = '<button class="primary" data-again>Новый раунд</button>'; root.querySelector('[data-again]').onclick = render; setResult(root, `CRUSH на ${data.crashAt.toFixed(2)}x. Ставка сгорела.`, 'bad'); await balance(); } catch {} }
    async function cashout(root, version) { if (!crashId) return; const id = crashId; crashId = ''; clearInterval(crashTimer); try { const data = await api(`/api/activity/crash/${id}/cashout`, {}); if (version !== scene) return; if (data.crashed) { root.querySelector('.crash-stage').classList.add('busted'); setResult(root, `CRUSH на ${data.crashAt.toFixed(2)}x. Ставка сгорела.`, 'bad'); } else setResult(root, `Забрано ${data.amount.toLocaleString()} ✦ на ${data.multiplier.toFixed(2)}x.`, 'good'); root.querySelector('.play').innerHTML = '<button class="primary" data-again>Новый раунд</button>'; root.querySelector('[data-again]').onclick = render; await balance(); } catch (error) { setResult(root, error.message, 'bad'); } }

    async function boot() {
      try {
        const { clientId } = await fetch('/api/activity/config').then(response => response.json());
        if (!clientId) throw new Error('CLIENT_ID не задан на сервере.');
        const discord = new DiscordSDK(clientId); await discord.ready();
        const { code } = await discord.commands.authorize({ client_id:clientId, response_type:'code', state:'', prompt:'none', scope:['identify'] });
        const session = await fetch('/api/activity/token', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ code }) }).then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data.error); return data; });
        await discord.commands.authenticate({ access_token:session.access_token }); token = session.activity_token;
        app.className = 'shell'; app.innerHTML = `<header class="head"><div class="brand"><b>✦</b> GUILDFORGE ARCADE</div><div id="balance" class="balance"></div></header><div class="layout"><aside class="sidebar"><div class="side-title">Игровые столы</div><div class="games">${Object.entries(games).map(([id, [label,, icon]]) => `<button data-game="${id}" class="${id === current ? 'active' : ''}"><span class="game-icon">${icon}</span>${label}</button>`).join('')}</div></aside><section id="board" class="board"></section></div>`;
        document.querySelectorAll('[data-game]').forEach(button => button.onclick = () => { current = button.dataset.game; document.querySelectorAll('[data-game]').forEach(item => item.classList.toggle('active', item === button)); render(); });
        await balance(); render();
      } catch (error) { app.className = 'loading'; app.textContent = `Не удалось запустить Activity: ${error.message}`; }
    }
    boot();
  </script>
</body>
</html>
