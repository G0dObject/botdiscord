<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guildforge Arcade</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap');
:root{--bg:#080b12;--panel:#121827;--line:#27314a;--text:#f5f7ff;--muted:#8c98b7;--gold:#ffcf67;--aqua:#60efd1;--pink:#fc7197;--violet:#8b7bff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0,#253b6a 0,transparent 38%),radial-gradient(ellipse at 90% 100%,#3d1e4f 0,transparent 37%),var(--bg);font-family:Manrope,sans-serif;color:var(--text)}button,input,select{font:inherit}button{border:0;color:inherit;cursor:pointer}.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}.shell{max-width:1240px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:800;letter-spacing:1.5px}.brand b{color:var(--gold)}.balance{font-family:'DM Mono';background:#101625;border:1px solid var(--line);padding:10px 14px;border-radius:12px;color:var(--gold)}.layout{display:grid;grid-template-columns:235px 1fr;gap:16px}.sidebar,.board{background:linear-gradient(145deg,#151c2bdf,#101522df);border:1px solid var(--line);border-radius:22px}.sidebar{padding:13px}.side-title{padding:11px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.4px}.games{display:grid;gap:6px}.games button{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:13px;background:transparent;color:var(--muted);font-weight:700}.games button:hover,.games button.active{background:#263251;color:#fff}.games button.active{box-shadow:inset 3px 0 var(--aqua)}.game-icon{width:25px;text-align:center}.board{min-height:570px;padding:30px;overflow:hidden}.eyebrow{font:500 11px 'DM Mono';letter-spacing:1.6px;color:var(--aqua)}h1{font-size:clamp(28px,4vw,44px);line-height:1.05;margin:10px 0}.hint{color:var(--muted);margin:0 0 25px}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.controls input,.controls select{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#0b1020;color:var(--text);min-width:120px}.action{padding:12px 16px;border-radius:11px;background:linear-gradient(135deg,var(--aqua),#76d8ff);color:#09101b;font-weight:800}.result{margin-top:22px;padding:17px;min-height:100px;border-radius:15px;background:#0c1120;border:1px solid var(--line);color:#cfd7ee;white-space:pre-line;line-height:1.65}.machine{position:relative;margin:28px auto 0;max-width:550px;padding:24px;border:1px solid #49557c;border-radius:22px;background:linear-gradient(150deg,#222c4a,#11172a);box-shadow:0 18px 60px #0006}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.reel{display:grid;place-items:center;height:86px;background:#070b15;border:1px solid #3b4669;border-radius:12px;font-size:22px;font-weight:800}.machine.spinning .reel{animation:reel .14s linear infinite}@keyframes reel{50%{transform:translateY(-5px);filter:brightness(1.7)}}.dice{width:118px;height:118px;margin:35px auto;display:grid;place-items:center;background:linear-gradient(145deg,#fc7197,#9a4bd6);border-radius:25px;font-size:62px;box-shadow:0 16px 45px #ff4f8533}.dice.rolling{animation:roll .65s ease-in-out}@keyframes roll{50%{transform:rotate(400deg) scale(.72)}}.coin{width:150px;height:150px;margin:20px auto;display:grid;place-items:center;border:9px solid #ffe19a;border-radius:50%;background:radial-gradient(circle,#f5ad42,#8f4915);font-size:54px;color:#fff8d6;box-shadow:0 0 0 8px #8f4915,0 20px 45px #0007}.coin.flip{animation:flip .9s ease-in-out}@keyframes flip{50%{transform:rotateY(720deg) scale(.7)}}.cards{font-size:22px;font-weight:800;letter-spacing:2px}.roulette-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:20px}.roulette-grid button{padding:9px 2px;border-radius:7px;background:#252c3d;font:500 12px 'DM Mono'}.roulette-grid button.red{background:#a83d55}.roulette-grid button.black{background:#242936}.roulette-grid button.green{background:#288d76}.roulette-grid button.selected{outline:3px solid var(--gold);z-index:1}.roulette-meta{display:flex;justify-content:space-between;gap:12px;margin-top:20px;color:var(--muted);font:12px 'DM Mono'}.players{margin-top:14px;display:grid;gap:7px}.player{display:flex;justify-content:space-between;background:#0c1120;border-radius:9px;padding:9px 11px;font-size:13px}.crash-stage{position:relative;height:220px;margin-top:25px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#131e3a,#090e19)}.crash-stage:after{content:'';position:absolute;inset:auto 0 27%;border-top:1px dashed #6380ae55}.rocket{position:absolute;left:12%;bottom:19%;font-size:46px;filter:drop-shadow(0 0 16px #fc7197);transform:rotate(42deg);transition:transform .12s linear}.multiplier{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(34px,7vw,70px) 'DM Mono';text-shadow:0 0 28px #60efd188}.crash-stage.busted{background:radial-gradient(circle,#90324c,#201019 55%)}.crash-stage.busted .rocket{opacity:0}.cash{background:linear-gradient(135deg,var(--gold),#ff9f57)}@media(max-width:720px){.shell{padding:12px}.layout{grid-template-columns:1fr}.sidebar{overflow:auto}.games{display:flex;width:max-content}.games button{white-space:nowrap}.board{padding:22px;min-height:620px}.roulette-grid{grid-template-columns:repeat(8,1fr)}}
</style></head><body><main id="app" class="loading">Подключение к Discord...</main><script>window.addEventListener('error',e=>document.getElementById('app').textContent='Не удалось загрузить Activity: '+e.message)</script><script type="module">
import {DiscordSDK} from '/activity/sdk/index.mjs';const {clientId}=await fetch('/api/activity/config').then(r=>r.json());const discord=new DiscordSDK(clientId);let token='',current='coin',twentyOneId='',rouletteChoice='red',crashId='',crashTimer=null;const games={coin:['Монетка','Выбери сторону. Верная ставка выплачивается 2x.','◉'],dice:['Кости','4, 5 или 6 приносят 2x ставку.','◆'],slots:['Слоты','Пара 2x, тройка 4x, три семёрки 10x.','▥'],roulette:['Общая рулетка','Все участники ставят в один раунд. Число 36x, цвет 2x.','◎'],twentyOne:['21','Карточный стол против дилера.','♠'],crash:['Crush','Забери выигрыш до того, как ракета сгорит.','↗']};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async(url,body)=>{const r=await fetch(url,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка запроса');return d};async function refresh(){const me=await api('/api/activity/me');$('#balance').textContent=Number(me.balance).toLocaleString('ru-RU')+' ✦';return me}function board(title,hint,content,result='Выбери ставку и начни игру.'){ $('#board').innerHTML=`<div class="eyebrow">GUILDFORGE / LIVE TABLES</div><h1>${title}</h1><p class="hint">${hint}</p><div id="play">${content}</div><div id="result" class="result">${result}</div>`}const bet=()=>Number($('#bet')?.value);function controls(extra='',label='Играть'){return `<div class="controls"><input id="bet" type="number" min="1" value="100">${extra}<button class="action" id="go">${label}</button></div>`}function render(){clearInterval(crashTimer);const [name,hint]=games[current];if(current==='coin'){board(name,hint,`${controls('<select id="choice"><option value="heads">Орёл</option><option value="tails">Решка</option></select>','Подбросить')}<div class="coin" id="visual">✦</div>`);$('#go').onclick=()=>playSimple('coin',true)}else if(current==='dice'){board(name,hint,`${controls('','Бросить')}<div class="dice" id="visual">◆</div>`);$('#go').onclick=()=>playSimple('dice')}else if(current==='slots'){board(name,hint,`${controls('','Крутить')}<div class="machine" id="visual"><div class="reels"><b class="reel">?</b><b class="reel">?</b><b class="reel">?</b></div></div>`);$('#go').onclick=()=>playSimple('slots')}else if(current==='twentyOne'){board(name,hint,controls('','Раздать карты'));$('#go').onclick=start21}else if(current==='roulette')renderRoulette();else renderCrash()}async function playSimple(game,choice){try{const visual=$('#visual');visual.classList.add(game==='coin'?'flip':game==='dice'?'rolling':'spinning');$('#go').disabled=true;await new Promise(r=>setTimeout(r,650));const data=await api('/api/activity/play',{game,bet:bet(),choice:choice?$('#choice').value:undefined});if(game==='slots')visual.querySelectorAll('.reel').forEach((x,i)=>x.textContent=data.text.split(' / ')[i]);else if(game==='dice')visual.textContent=data.text.match(/\d/)?.[0]||'◆';else visual.textContent=data.text.includes('орёл')?'◉':'◌';$('#result').textContent=`${data.text}\n${data.balance.toLocaleString('ru-RU')} ✦`;await refresh()}catch(e){$('#result').textContent=e.message}finally{$('#go')&&( $('#go').disabled=false)}}async function start21(){try{const game=await api('/api/activity/twenty-one/start',{bet:bet()});twentyOneId=game.id;show21(game)}catch(e){$('#result').textContent=e.message}}function show21(game){$('#play').innerHTML='<div class="controls"><button class="action" id="hit">Взять карту</button><button id="stand">Хватит</button></div>';$('#result').innerHTML=`<div class="cards">Ты: ${game.player.join(' · ')} = ${game.score}</div><div class="cards">Дилер: ${game.bot.join(' · ')} · ?</div><p>Ставка: ${game.bet.toLocaleString('ru-RU')} ✦</p>`;$('#hit').onclick=()=>move21('hit');$('#stand').onclick=()=>move21('stand')}async function move21(action){try{const game=await api('/api/activity/twenty-one/'+twentyOneId,{action});if(game.active)return show21(game);$('#play').innerHTML='<button class="action" id="again">Новая раздача</button>';$('#again').onclick=render;$('#result').innerHTML=`<div class="cards">Ты: ${game.player.join(' · ')} = ${game.score}</div><div class="cards">Дилер: ${game.bot.join(' · ')} = ${game.botScore}</div><p>${esc(game.text)}</p>`;await refresh()}catch(e){$('#result').textContent=e.message}}function renderRoulette(){const numbers=Array.from({length:37},(_,n)=>`<button class="${n===0?'green':[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n)?'red':'black'} ${rouletteChoice===String(n)?'selected':''}" data-choice="${n}">${n}</button>`).join('');board(games.roulette[0],games.roulette[1],`${controls('<button class="red" data-choice="red">Красное 2x</button><button class="black" data-choice="black">Чёрное 2x</button><button class="green" data-choice="green">Зеро 14x</button>','Поставить')}<div class="roulette-grid">${numbers}</div><div class="roulette-meta"><span>Выбор: <b id="picked">${rouletteChoice}</b></span><span id="countdown">Ожидание игроков</span></div><div id="players" class="players"></div>`,'Выбери поле. Ставка списывается сразу и участвует в общем раунде.');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{rouletteChoice=b.dataset.choice;$('#picked').textContent=rouletteChoice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x.dataset.choice===rouletteChoice))});$('#go').onclick=placeRoulette;watchRoulette()}async function placeRoulette(){try{const data=await api('/api/activity/roulette/bet',{bet:bet(),choice:rouletteChoice});$('#result').textContent='Ставка принята. Ждём остальных игроков.';$('#go').disabled=true;await refresh();paintRoulette(data)}catch(e){$('#result').textContent=e.message}}async function watchRoulette(){try{paintRoulette(await api('/api/activity/roulette'))}catch(e){}}function paintRoulette(data){const players=$('#players');if(!players)return;players.innerHTML=data.players.map(p=>`<div class="player"><span>${esc(p.username)} · ${p.choice}</span><b>${p.bet.toLocaleString()} ✦${p.won===true?' · выиграл':p.won===false?' · мимо':''}</b></div>`).join('')||'<div class="player">Пока никто не поставил</div>';if(data.status==='betting'){$('#countdown').textContent=`До броска: ${Math.max(0,Math.ceil((data.closesAt-Date.now())/1000))} сек.`;setTimeout(watchRoulette,800)}else if(data.status==='settled'){$('#countdown').textContent=`Выпало: ${data.result}`;$('#result').textContent=`Рулетка остановилась на ${data.result}.`;refresh()}}function renderCrash(){board(games.crash[0],games.crash[1],`${controls('','Запустить')}<div class="crash-stage" id="stage"><div class="multiplier" id="multi">1.00x</div><div class="rocket">↗</div></div>`,'Ставка списывается на старте. Нажми «Забрать», пока ракета в пути.');$('#go').onclick=startCrash}async function startCrash(){try{const data=await api('/api/activity/crash/start',{bet:bet()});crashId=data.id;const start=Date.now(),stage=$('#stage');$('#play').innerHTML='<div class="controls"><button class="action cash" id="cash">Забрать выигрыш</button></div>';crashTimer=setInterval(()=>{const m=Math.exp((Date.now()-start)/8500);$('#multi').textContent=m.toFixed(2)+'x';stage.querySelector('.rocket').style.transform=`translate(${Math.min(390,(m-1)*180)}px,${-Math.min(110,(m-1)*55)}px) rotate(42deg)`},70);$('#cash').onclick=cashout}catch(e){$('#result').textContent=e.message}}async function cashout(){if(!crashId)return;const id=crashId;crashId='';clearInterval(crashTimer);try{const data=await api('/api/activity/crash/'+id+'/cashout',{});if(data.crashed){$('#stage').classList.add('busted');$('#result').textContent=`CRUSH на ${data.crashAt.toFixed(2)}x. Ставка сгорела.`}else $('#result').textContent=`Забрано ${data.amount.toLocaleString()} ✦ на ${data.multiplier.toFixed(2)}x.`;$('#play').innerHTML='<button class="action" id="again">Новый раунд</button>';$('#again').onclick=render;await refresh()}catch(e){$('#result').textContent=e.message}}async function boot(){try{if(!clientId)throw Error('CLIENT_ID не задан на сервере.');await discord.ready();const {code}=await discord.commands.authorize({client_id:clientId,response_type:'code',state:'',prompt:'none',scope:['identify']});const session=await fetch('/api/activity/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);return d});await discord.commands.authenticate({access_token:session.access_token});token=session.activity_token;$('#app').className='shell';$('#app').innerHTML=`<header class="head"><div class="brand"><b>✦</b> GUILDFORGE ARCADE</div><div id="balance" class="balance"></div></header><div class="layout"><aside class="sidebar"><div class="side-title">Игровые столы</div><div class="games">${Object.entries(games).map(([id,[name,,icon]])=>`<button data-game="${id}" class="${id===current?'active':''}"><span class="game-icon">${icon}</span>${name}</button>`).join('')}</div></aside><section id="board" class="board"></section></div>`;document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{current=b.dataset.game;document.querySelectorAll('[data-game]').forEach(x=>x.classList.toggle('active',x===b));render()});await refresh();render()}catch(e){$('#app').textContent='Не удалось запустить Activity: '+e.message}}boot();
</script></body></html>
