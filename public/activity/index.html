<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guildforge Arcade</title>
  <style>
    :root{--ink:#0e1220;--panel:#191f33;--line:#303958;--text:#f7f8ff;--muted:#9ba6c7;--lime:#b8f36d;--violet:#8374ff;--red:#ff7996}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#29356d 0,transparent 32%),radial-gradient(circle at 90% 100%,#314c43 0,transparent 32%),var(--ink);color:var(--text);font-family:system-ui,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:11px;background:var(--violet);color:white;font-weight:750;padding:11px 14px;cursor:pointer}button:hover{filter:brightness(1.1)}button:disabled{opacity:.45;cursor:wait}.shell{max-width:1080px;margin:auto;padding:24px}.head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.brand{font-weight:900;letter-spacing:1px}.brand b{color:var(--lime)}.balance{font-variant-numeric:tabular-nums;padding:9px 13px;background:#111727;border:1px solid var(--line);border-radius:10px}.layout{display:grid;grid-template-columns:245px 1fr;gap:18px}.sidebar,.board{border:1px solid var(--line);background:#171d30cc;border-radius:18px;padding:16px}.sidebar p{color:var(--muted);font-size:13px;line-height:1.45}.games{display:grid;gap:8px}.games button{background:#232b46;text-align:left}.games button.active{background:var(--lime);color:var(--ink)}.board{min-height:460px;padding:26px}.eyebrow{color:var(--lime);font-weight:800;font-size:12px;letter-spacing:1.3px}.board h1{margin:8px 0;font-size:32px}.hint{color:var(--muted);margin:0 0 24px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.controls input,.controls select{min-width:130px;border:1px solid var(--line);background:#101627;color:var(--text);border-radius:11px;padding:11px}.action{background:var(--lime);color:var(--ink)}.result{white-space:pre-line;min-height:108px;margin-top:26px;padding:18px;border-radius:13px;background:#101627;border:1px solid var(--line);line-height:1.6}.cards{font-size:22px;font-weight:800;letter-spacing:2px}.roulette{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:16px}.roulette button{padding:8px;background:#26304e}.roulette button.selected{background:var(--red)}.loading{display:grid;place-items:center;min-height:100vh;color:var(--muted)}@media(max-width:650px){.shell{padding:14px}.layout{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,1fr)}.board{padding:20px}.roulette{grid-template-columns:repeat(6,1fr)}.head{align-items:flex-start;flex-direction:column}.board h1{font-size:27px}}
  </style>
</head>
<body><main id="app" class="loading">Подключение к Discord...</main>
<script type="module">
  import { DiscordSDK } from '/activity/sdk/index.mjs';
  const {clientId} = await fetch('/api/activity/config').then(response=>response.json());
  const discord = new DiscordSDK(clientId); let token='', current='coin', twentyOneId='', rouletteChoice=0;
  const games={coin:['Монетка','Выбери сторону и угадай бросок.'],dice:['Кости','4, 5 или 6 приносят 2x ставку.'],slots:['Слоты','Пара даёт 2x, тройка 4x, три 7 дают 10x.'],roulette:['Рулетка','Угадай одно число от 0 до 36 и получи 36x.'],twentyOne:['21','Играй против бота. Бот добирает до 17.']};
  const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw new Error(data.error||'Ошибка запроса');return data}
  async function refresh(){const me=await api('/api/activity/me');$('#balance').textContent=Number(me.balance).toLocaleString('ru-RU')+' ✦';return me}
  function render(){const [name,hint]=games[current];$('#board').innerHTML=`<div class="eyebrow">GUILDFORGE ARCADE</div><h1>${name}</h1><p class="hint">${hint}</p><div id="play"></div><div id="result" class="result">Выбери ставку и начни игру.</div>`;const play=$('#play');if(current==='coin')play.innerHTML=`<div class="controls"><input id="bet" type="number" min="1" value="100"><select id="choice"><option value="heads">Орёл</option><option value="tails">Решка</option></select><button class="action" id="go">Бросить</button></div>`;else if(current==='roulette'){play.innerHTML=`<div class="controls"><input id="bet" type="number" min="1" value="100"><button class="action" id="go">Крутить</button></div><div class="roulette">${Array.from({length:37},(_,n)=>`<button data-n="${n}" class="${n===rouletteChoice?'selected':''}">${n}</button>`).join('')}</div>`;play.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{rouletteChoice=Number(b.dataset.n);render()});}else if(current==='twentyOne')play.innerHTML=`<div class="controls"><input id="bet" type="number" min="1" value="100"><button class="action" id="go">Раздать карты</button></div>`;else play.innerHTML=`<div class="controls"><input id="bet" type="number" min="1" value="100"><button class="action" id="go">Играть</button></div>`;$('#go').onclick=start;}
  async function start(){try{const bet=Number($('#bet').value);if(current==='twentyOne'){const game=await api('/api/activity/twenty-one/start',{bet});twentyOneId=game.id;show21(game);return}const game=await api('/api/activity/play',{game:current,bet,choice:current==='coin'?$('#choice').value:rouletteChoice});$('#result').textContent=game.text;await refresh()}catch(error){$('#result').textContent=error.message}}
  function show21(game){$('#play').innerHTML=`<div class="controls"><button class="action" id="hit">Взять карту</button><button id="stand">Хватит</button></div>`;$('#result').innerHTML=`<div class="cards">Ты: ${game.player.join(' · ')} = ${game.score}</div><div class="cards">Бот: ${game.bot.join(' · ')} · ?</div><p>Ставка: ${game.bet.toLocaleString('ru-RU')} ✦</p>`;$('#hit').onclick=()=>move21('hit');$('#stand').onclick=()=>move21('stand')}
  async function move21(action){try{const game=await api('/api/activity/twenty-one/'+twentyOneId,{action});if(game.active)return show21(game);$('#play').innerHTML='<button class="action" id="again">Новая игра</button>';$('#again').onclick=render;$('#result').innerHTML=`<div class="cards">Ты: ${game.player.join(' · ')} = ${game.score}</div><div class="cards">Бот: ${game.bot.join(' · ')} = ${game.botScore}</div><p>${esc(game.text)}</p>`;await refresh()}catch(error){$('#result').textContent=error.message}}
  async function boot(){try{await discord.ready();const {code}=await discord.commands.authorize({client_id:clientId,response_type:'code',state:'',prompt:'none',scope:['identify']});const session=await fetch('/api/activity/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error);return d});const auth=await discord.commands.authenticate({access_token:session.access_token});if(!auth)throw new Error('Discord не подтвердил сессию.');token=session.activity_token;$('#app').className='shell';$('#app').innerHTML=`<header class="head"><div class="brand"><b>✦</b> GUILDFORGE ARCADE</div><div id="balance" class="balance"></div></header><div class="layout"><aside class="sidebar"><strong>Мини-игры</strong><p>Ставки используют тот же баланс, что и Discord-бот.</p><div class="games">${Object.entries(games).map(([id,[name]])=>`<button data-game="${id}" class="${id===current?'active':''}">${name}</button>`).join('')}</div></aside><section id="board" class="board"></section></div>`;document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{current=b.dataset.game;document.querySelectorAll('[data-game]').forEach(x=>x.classList.toggle('active',x===b));render()});await refresh();render()}catch(error){$('#app').textContent='Не удалось запустить Activity: '+error.message}}
  boot();
</script></body></html>
